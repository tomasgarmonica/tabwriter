# Copia de seguridad semanal de la base de Supabase (domingos a la madrugada).
# La copia queda cifrada como "artifact" del workflow durante 90 días (Actions > Respaldo semanal > el último run).
# Requiere dos secretos en Settings > Secrets and variables > Actions:
#   SUPABASE_DB_URL   conexión "Session pooler" de Supabase (Connect > Session pooler), con la contraseña de la base
#   RESPALDO_CLAVE    contraseña para cifrar la copia (guardarla aparte: sin ella no se puede abrir)
# Para abrir una copia: gpg --decrypt respaldo-AAAA-MM-DD.sql.gpg > respaldo.sql
name: Respaldo semanal

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Copiar la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          fecha=$(date +%F)
          # Tablas del sitio (estructura y datos) y las cuentas de usuario (solo datos)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public > public.sql
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --data-only \
            --table=auth.users --table=auth.identities > cuentas.sql
          cat public.sql cuentas.sql > "respaldo-$fecha.sql"
          echo "Tamaño: $(du -h "respaldo-$fecha.sql" | cut -f1)"
          grep -c "^COPY public\." "respaldo-$fecha.sql"
      - name: Cifrar
        env:
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          test -n "$RESPALDO_CLAVE"
          for archivo in respaldo-*.sql; do
            gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$RESPALDO_CLAVE" -o "$archivo.gpg" "$archivo"
            rm "$archivo"
          done
          rm -f public.sql cuentas.sql
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo
          path: respaldo-*.sql.gpg
          retention-days: 90
