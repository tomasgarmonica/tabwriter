# Publica el sitio en GitHub Pages con una página fija por tab (para buscadores) y el sitemap.xml.
# Corre con cada push a main y cada hora, para sumar las tabs nuevas.
# Requiere Settings > Pages > Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Armar el sitio
        run: node .github/generar-paginas.js _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deployment
        uses: actions/deploy-pages@v4
